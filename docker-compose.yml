services:
  mongo:
    image: mongo:9-noble
    container_name: core-mongo
    restart: unless-stopped
    command: ["--auth"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-core_secure_mongo_pass_2026}
      MONGO_INITDB_DATABASE: coreapp
    volumes:
      - mongodb_data:/data/db
    networks:
      - internal-net
    # Ports are NOT mapped to the host (kept strictly internal)
    expose:
      - "27017"
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - "CMD"
        - "mongosh"
        - "--quiet"
        - "-u"
        - "${MONGO_ROOT_USER:-admin}"
        - "-p"
        - "${MONGO_ROOT_PASSWORD:-core_secure_mongo_pass_2026}"
        - "--authenticationDatabase"
        - "admin"
        - "--eval"
        - "db.adminCommand('ping')"
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7.4-alpine
    container_name: core-redis
    restart: unless-stopped
    command:
      - "redis-server"
      - "--requirepass"
      - "${REDIS_PASSWORD:-core_secure_redis_pass_2026}"
      - "--protected-mode"
      - "yes"
    volumes:
      - redis_data:/data
    networks:
      - internal-net
    # Ports are NOT mapped to the host (kept strictly internal)
    expose:
      - "6379"
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - "CMD"
        - "redis-cli"
        - "-a"
        - "${REDIS_PASSWORD:-core_secure_redis_pass_2026}"
        - "ping"
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: core-app
    restart: unless-stopped
    environment:
      NODE_ENV: development
      MONGODB_URI: mongodb://${MONGO_ROOT_USER:-admin}:${MONGO_ROOT_PASSWORD:-core_secure_mongo_pass_2026}@mongo:27017/coreapp?authSource=admin
      REDIS_URL: redis://:${REDIS_PASSWORD:-core_secure_redis_pass_2026}@redis:6379
      PORT: 1344
      API_PORT: 1345
      GUEST_EMAIL: ${GUEST_EMAIL}
      GUEST_PASSWORD: ${GUEST_PASSWORD}
      GUEST_ENABLED: ${GUEST_ENABLED:-true}
    # Only application ports are exposed to host
    ports:
      - "1344:1344" # Web UI & SPA SSR fallback
      - "1345:1345" # REST API Server
      - "3000:3000" # Frontend development / Vite HMR
    volumes:
      # Mount host repository into container for instant live reload
      - .:/app
      # Anonymous volume preserves container-specific Linux node_modules
      - /app/node_modules
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal-net
    security_opt:
      - no-new-privileges:true

# ===========================================================================
# Isolated Internal Bridge Network & Persistent Volumes
# ===========================================================================
networks:
  internal-net:
    driver: bridge

volumes:
  mongodb_data:
    driver: local
  redis_data:
    driver: local
