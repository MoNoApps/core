<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Core</title>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("core_theme");
          var theme = stored || "classic";
          document.documentElement.setAttribute("data-theme", theme);
          var darkThemes = ["charcoal", "studio", "cyber", "sunset"];
          document.documentElement.setAttribute(
            "data-theme-mode",
            darkThemes.indexOf(theme) !== -1 ? "dark" : "light",
          );
        } catch (e) {}
      })();
    </script>
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23007bff' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><polygon points='12 2 2 7 12 12 22 7 12 2'/><polyline points='2 17 12 22 22 17'/><polyline points='2 12 12 17 22 12'/></svg>"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
